name: Go mock reader (host and Android)
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build host and paired Android runtime binaries
        run: |
          NDK_ROOT="${ANDROID_NDK_HOME:-}"
          if [ ! -x "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" ]; then
            NDK_ROOT="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          fi
          if [ ! -x "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)"
            yes | "$SDKMANAGER" 'ndk;27.2.12479018'
            NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          NDK="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK/aarch64-linux-android21-clang"
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o dist/sms-book-reader-linux-amd64 .
          CC="$NDK/armv7a-linux-androideabi21-clang" GOOS=android GOARCH=arm GOARM=7 CGO_ENABLED=1 go build -trimpath -ldflags='-s -w' -o dist/sms-book-reader-android-armv7 .
          CC="$NDK/aarch64-linux-android21-clang" GOOS=android GOARCH=arm64 CGO_ENABLED=1 go build -trimpath -ldflags='-s -w' -o dist/sms-book-reader-android-arm64 .
          (cd dist && sha256sum * > SHA256SUMS)
          ./dist/sms-book-reader-linux-amd64 seed
          ./dist/sms-book-reader-linux-amd64 jog ada continue
        env:
          SMS_READER_HOME: ${{ runner.temp }}/sms-mock-readers
      - uses: actions/upload-artifact@v4
        with:
          name: sms-book-reader-go-binaries
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publish checksum-pinned preview binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/go-mock-reader'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/SHA256SUMS
          gh release create "sms-preview-${GITHUB_SHA}" dist/sms-book-reader-android-armv7 dist/sms-book-reader-android-arm64 dist/sms-book-reader-linux-amd64 dist/SHA256SUMS --target "$GITHUB_SHA" --title "Mock reader ${GITHUB_SHA}" --notes "Mock book passages, no SMS carrier, no physical-device acceptance. Build candidates only." --prerelease

